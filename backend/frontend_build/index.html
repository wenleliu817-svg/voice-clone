<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有道声音克隆 · 一键合成</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fa-solid fa-microphone-lines"></i> 有道声音克隆</h1>
      <p class="subtitle">参考音频 + 文本，一次完成克隆与合成</p>
    </header>

    <!-- Step 1: Credentials -->
    <section class="card">
      <div class="card-header">
        <span class="step-badge">1</span>
        <h2>API 凭证</h2>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>App Key</label>
          <input type="text" id="appKey" placeholder="输入有道 App Key">
        </div>
        <div class="form-group">
          <label>App Secret</label>
          <input type="password" id="appSecret" placeholder="输入有道 App Secret">
          <button type="button" class="toggle-pw" onclick="toggleSecret()">
            <i class="fa-regular fa-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- Step 2: Reference Audio -->
    <section class="card">
      <div class="card-header">
        <span class="step-badge">2</span>
        <h2>参考音频</h2>
      </div>
      <div class="upload-zone" id="audio-dropzone">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p>拖拽 .wav 音频文件到此处，或 <span class="link" onclick="document.getElementById('audioFile').click()">点击选择</span></p>
        <input type="file" id="audioFile" accept=".wav,audio/wav" hidden>
        <p class="hint">推荐 5-10 秒清晰人声样本</p>
      </div>
      <div id="audio-preview" class="file-preview hidden">
        <div class="file-info">
          <i class="fa-solid fa-file-audio file-icon"></i>
          <span id="audio-filename" class="filename"></span>
          <button class="btn-icon" onclick="clearAudio()" title="移除"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div id="audio-status" class="field-hint"></div>
      <div class="form-row settings">
        <div class="form-group">
          <label>语种</label>
          <select id="language-select"></select>
          <div class="field-hint" id="language-hint"></div>
        </div>
        <div class="form-group">
          <label>模型</label>
          <select id="model-select">
            <option value="lite">lite</option>
            <option value="pro">pro</option>
          </select>
          <div class="field-hint" id="model-hint"></div>
        </div>
      </div>
    </section>

    <!-- Step 3: Text -->
    <section class="card">
      <div class="card-header">
        <span class="step-badge">3</span>
        <h2>合成文本</h2>
      </div>
      <div class="form-group">
        <label>文本</label>
        <textarea id="composeText" class="input-area" rows="6" placeholder="输入要合成的一整段文本"></textarea>
        <div class="field-hint">整段文本会作为一条结果生成。</div>
      </div>
    </section>

    <!-- Step 4: Settings & Run -->
    <section class="card">
      <div class="card-header">
        <span class="step-badge">4</span>
        <h2>合成设置</h2>
      </div>
      <div class="form-row settings">
        <div class="form-group">
          <label>音频格式</label>
          <select id="format"><option value="wav">WAV</option><option value="mp3">MP3</option></select>
        </div>
        <div class="form-group">
          <label>语速 (0.5 - 2.0)</label>
          <input type="number" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="form-group">
          <label>音量 (0.5 - 2.0)</label>
          <input type="number" id="volume" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>
      </div>
      <button class="btn btn-primary btn-large" id="btn-synthesize" onclick="startSynthesis()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> 一键生成
      </button>
    </section>

    <section class="card hidden" id="progress-card" aria-live="polite">
      <div class="card-header">
        <h2><i class="fa-solid fa-bars-progress"></i> 处理进度</h2>
        <span id="progress-percent" class="progress-percent">0%</span>
      </div>
      <ol class="progress-steps" id="progress-steps">
        <li data-stage="received"><span class="progress-dot">1</span><span><strong>参考音频已接收</strong><small>等待开始</small></span></li>
        <li data-stage="cloning"><span class="progress-dot">2</span><span><strong>克隆中</strong><small>正在创建音色</small></span></li>
        <li data-stage="clone_complete"><span class="progress-dot">3</span><span><strong>克隆完成</strong><small>音色已准备好</small></span></li>
        <li data-stage="synthesizing"><span class="progress-dot">4</span><span><strong>合成中</strong><small>正在生成音频</small></span></li>
        <li data-stage="completed"><span class="progress-dot">5</span><span><strong>合成完成</strong><small>可以播放和下载</small></span></li>
      </ol>
      <p id="progress-message" class="progress-info">等待开始</p>
    </section>

    <!-- Step 5: Results -->
    <section class="card hidden" id="results-card">
      <div class="card-header">
        <h2><i class="fa-solid fa-music"></i> 合成结果</h2>
      </div>
      <div id="results-list" class="results-list"></div>
    </section>

  </div>

  <script src="transport.js?v=20260907-1"></script>
  <script src="app.js?v=20260907-1"></script>
</body>
</html>
